name: PPU pin unit tests

on:
  workflow_call:
    inputs:
      pr_mode:
        type: boolean
        default: false
      pr_head_sha:
        type: string
        default: ""
      wheel_source_sha:
        description: Validated SAIL source of the reused wheels
        type: string
        default: ""
      build_run_id:
        description: PPU CI build run supplying ppu-wheels-<run_id>
        required: true
        type: string
      image:
        description: CUDA-compatible runtime image preloaded on the PPU runner
        type: string
        default: reg.docker.alibaba-inc.com/ai-tmp/llm:pytorch2.13.0-ubuntu24.04-cuda13.0-vllm0.27.0-py312-ppu202610070948

permissions:
  contents: read
  actions: read
cache-mode: none

jobs:
  pin-unit-tests:
    name: main-verified
    runs-on: 8-ppu-m890p
    timeout-minutes: 45
    env:
      GIT_CONFIG_NOSYSTEM: "1"
    defaults:
      run:
        shell: bash
    steps:
      - name: Prepare private runtime directories and Git configuration
        id: runtime
        run: |
          config="$(mktemp "${RUNNER_TEMP}/git-config.XXXXXX")"
          wheels="$(mktemp -d "${RUNNER_TEMP}/ppu-pin-wheels.XXXXXX")"
          artifacts="$(mktemp -d "${RUNNER_TEMP}/ppu-pin-artifacts.XXXXXX")"
          {
            printf 'GIT_CONFIG_GLOBAL=%s\n' "$config"
            printf 'wheels=%s\n' "$wheels"
            printf 'artifacts=%s\n' "$artifacts"
          } >> "$GITHUB_OUTPUT"
          printf 'GIT_CONFIG_GLOBAL=%s\n' "$config" >> "$GITHUB_ENV"

      - name: Require disabled cache access
        uses: actions/github-script@v7
        with:
          script: |
            if (process.env.ACTIONS_CACHE_MODE !== 'none') {
              core.setFailed('PPU CI requires cache-mode: none');
            }

      - name: Check out vLLM SAIL
        uses: actions/checkout@v4
        with:
          github-server-url: https://github.com
          ref: ${{ inputs.pr_head_sha || github.sha }}
          persist-credentials: false

      - name: Verify checked-out revision
        env:
          EXPECTED_SHA: ${{ inputs.pr_head_sha || github.sha }}
        run: test "$(git -c safe.directory="$PWD" rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Download CI-built wheels
        uses: actions/download-artifact@v4
        with:
          name: ppu-wheels-${{ inputs.build_run_id }}
          path: ${{ steps.runtime.outputs.wheels }}
          run-id: ${{ inputs.build_run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}

      - name: Verify wheel manifest and pin
        id: manifest
        env:
          WHEELS_DIR: ${{ steps.runtime.outputs.wheels }}
          REQUIRE_PR_ARTIFACT: ${{ inputs.pr_mode }}
          WHEEL_SOURCE_SHA: ${{ inputs.wheel_source_sha || inputs.pr_head_sha || github.sha }}
        run: |
          python3 scripts/ci/ppu_wheel_manifest.py verify "${WHEELS_DIR}"
          python3 - <<'PYTHON'
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          manifest = json.loads((Path(os.environ["WHEELS_DIR"]) / "wheel-manifest.json").read_text())
          expected = Path(".github/vllm-main-verified.commit").read_text().strip()
          if not re.fullmatch(r"[0-9a-f]{40}", expected):
              raise SystemExit("main-verified must contain an immutable upstream commit SHA")
          actual = manifest["commits"]["vllm"]
          matches = actual == expected
          if os.environ["REQUIRE_PR_ARTIFACT"] == "true":
              cmd = ["python3", "scripts/ci/ppu_wheel_manifest.py", "verify", os.environ["WHEELS_DIR"],
                     "--vllm-commit", expected, "--sail-commit", os.environ["WHEEL_SOURCE_SHA"]]
              subprocess.run(cmd, check=True)
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"matches={str(matches).lower()}\n")
          summary = f"main-verified: build={actual}, pin={expected}"
          if not matches:
              summary += "; UT skipped because this build does not contain that pin"
              print(f"::notice::{summary}")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as output:
              output.write(summary + "\n")
          PYTHON

      - name: Run pin UT in the preloaded CUDA-compatible runtime
        if: steps.manifest.outputs.matches == 'true'
        env:
          PPU_RUNTIME_IMAGE: ${{ inputs.image }}
          PPU_CI_SOURCE_DIR: ${{ github.workspace }}
          PPU_CI_SOURCE_SHA: ${{ inputs.pr_head_sha || github.sha }}
          PPU_CI_WHEELS_DIR: ${{ steps.runtime.outputs.wheels }}
          PPU_CI_ARTIFACT_DIR: ${{ steps.runtime.outputs.artifacts }}
          PPU_CI_DEVICE_COUNT: "1"
        run: bash scripts/ci/ppu_runtime_container.sh pin-ut

      - name: Upload pin UT diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ppu-pin-main-verified-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.runtime.outputs.artifacts }}/**
            ${{ steps.runtime.outputs.wheels }}/wheel-manifest.json
          if-no-files-found: warn
          retention-days: 14
