name: PPU PR pipeline

on:
  workflow_call:
    inputs:
      pr_head_sha:
        description: Exact PR head SHA under test
        type: string
        required: true
      existing_build_run_id:
        description: Skip build and reuse wheels from this run
        type: string
        default: ""
      wheel_source_sha:
        description: Validated SAIL source of the reused wheels
        type: string
        default: ""

permissions:
  contents: read
  actions: read
cache-mode: none

jobs:
  build:
    if: inputs.existing_build_run_id == ''
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/_ppu-build.yaml
    with:
      pr_head_sha: ${{ inputs.pr_head_sha }}

  pin-unit-tests:
    name: PPU pin UT
    needs: build
    if: >-
      ${{ !cancelled() && (needs.build.result == 'success' ||
      (needs.build.result == 'skipped' && inputs.existing_build_run_id != '' &&
      inputs.wheel_source_sha != '')) }}
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/_ppu-pin-ut.yaml
    with:
      pr_mode: true
      pr_head_sha: ${{ inputs.pr_head_sha }}
      build_run_id: ${{ inputs.existing_build_run_id || github.run_id }}
      wheel_source_sha: ${{ inputs.wheel_source_sha }}
      image: ${{ needs.build.outputs.image || 'reg.docker.alibaba-inc.com/ai-tmp/llm@sha256:24872709b1a84ec0e91260eeeccf6ae7ba52a6c70fb90f55a7aae1c1df503bcb' }}

  model-tests:
    name: PPU model tests
    needs: build
    if: >-
      ${{ !cancelled() && (needs.build.result == 'success' ||
      (needs.build.result == 'skipped' && inputs.existing_build_run_id != '' &&
      inputs.wheel_source_sha != '')) }}
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/_ppu-model-tests.yaml
    with:
      pr_mode: true
      pr_head_sha: ${{ inputs.pr_head_sha }}
      build_run_id: ${{ inputs.existing_build_run_id || github.run_id }}
      wheel_source_sha: ${{ inputs.wheel_source_sha }}
      image: ${{ needs.build.outputs.image || 'reg.docker.alibaba-inc.com/ai-tmp/llm@sha256:24872709b1a84ec0e91260eeeccf6ae7ba52a6c70fb90f55a7aae1c1df503bcb' }}

  gate:
    name: PPU CI gate
    needs: [build, pin-unit-tests, model-tests]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every PPU stage to succeed
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
          EXISTING_BUILD_RUN_ID: ${{ inputs.existing_build_run_id }}
          WHEEL_SOURCE_SHA: ${{ inputs.wheel_source_sha }}
        run: |
          python - <<'PYTHON'
          import json
          import os

          results = json.loads(os.environ["JOB_RESULTS"])
          for job, result in results.items():
              print(f"{job}: {result['result']}")
          build = results.get("build", {}).get("result")
          reuse = os.environ["EXISTING_BUILD_RUN_ID"] and os.environ["WHEEL_SOURCE_SHA"]
          if build != "success" and not (build == "skipped" and reuse):
              raise SystemExit(f"build did not succeed or use validated wheels: {build}")
          for job in ("pin-unit-tests", "model-tests"):
              result = results.get(job, {}).get("result")
              if result != "success":
                  raise SystemExit(f"{job} did not succeed: {result}")
          PYTHON
