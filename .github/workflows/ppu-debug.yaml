name: PPU debug
run-name: "PPU debug: ${{ inputs.target }} on build ${{ inputs.build_run_id }}"

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Run ID whose ppu-wheels-<run_id> artifact holds the wheels under test
        required: true
        type: string
      target:
        description: Stages to rerun against the existing build
        required: true
        type: choice
        options: [both, pin-ut, model-tests]
        default: both
      models:
        description: Comma-separated model catalog keys for model tests (blank = every model in scripts/ci/ppu_e2e_models.json)
        required: false
        default: qwen3.8-27b-m890p
        type: string
      image:
        description: SAIL runtime image for the PPU pods
        required: true
        default: reg.docker.alibaba-inc.com/ai-tmp/llm:pytorch2.13.0-ubuntu24.04-cuda13.0-vllm0.27.0-py312-ppu202610070948
        type: string

permissions:
  contents: read
  actions: read
cache-mode: none

jobs:
  pin-unit-tests:
    name: PPU pin UT
    if: inputs.target != 'model-tests'
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/_ppu-pin-ut.yaml
    with:
      pr_mode: false
      build_run_id: ${{ inputs.build_run_id }}
      image: ${{ inputs.image }}

  model-tests:
    name: PPU model tests
    if: inputs.target != 'pin-ut'
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/_ppu-model-tests.yaml
    with:
      pr_mode: false
      build_run_id: ${{ inputs.build_run_id }}
      image: ${{ inputs.image }}
      models: ${{ inputs.models }}
